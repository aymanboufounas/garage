plugins { id 'com.android.application' }
def serverUrl = providers.gradleProperty('serverUrl').getOrElse('')
if (serverUrl && !(serverUrl ==~ /^https:\/\/[a-zA-Z0-9.-]+(?::443)?\/?$/)) {
    throw new GradleException('serverUrl must be an HTTPS origin, for example https://app.example.com')
}
android {
    namespace 'ma.garageshare.app'
    compileSdk 36
    defaultConfig {
        applicationId 'ma.garageshare.app'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.7.0'
        manifestPlaceholders.googleAppLinkHost = serverUrl ? java.net.URI.create(serverUrl).host : 'preview.invalid'
        buildConfigField 'String', 'SERVER_URL', '"' + serverUrl + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
tasks.configureEach { task ->
    if (task.name == 'preBuild') task.dependsOn('syncWebAssets')
    if (task.name in ['preReleaseBuild','assembleRelease','bundleRelease']) {
        task.doFirst { if (!serverUrl) throw new GradleException('Release requires -PserverUrl=https://YOUR_DEPLOYED_DOMAIN'); }
    }
}

tasks.register('syncWebAssets', Copy) {
    from rootProject.file('../web')
    into layout.projectDirectory.dir('src/main/assets/web')
}
